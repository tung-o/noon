  <script>
    /* Audio System using Web Audio API (No external sound files required) */
    let audioCtx = null;
    let isSoundOn = true;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('sound-btn');
      btn.innerText = isSoundOn ? '🔊' : '🔇';
      btn.classList.toggle('opacity-60', !isSoundOn);
    }

    function playSound(type) {
      if (!isSoundOn) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          // Cheerful high arpeggio
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'hint') {
          // Soft friendly 'bloop'
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'click') {
          // Short crisp click
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'win') {
          // Victory fanfare
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = 'sine';
            o.frequency.value = freq;
            const t = now + idx * 0.12;
            g.gain.setValueAtTime(0.2, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            o.start(t);
            o.stop(t + 0.35);
          });
        }
      } catch (e) {
        console.warn('Audio not supported or blocked:', e);
      }
    }

        }

    function updateScoreDisplay() {
      const scoreEl = document.getElementById('score-display');

    function setProgress(title, percent) {
      const titleEl = document.getElementById('stage-indicator');
      const percentEl = document.getElementById('progress-percent');
      const barEl = document.getElementById('progress-bar');
      if (titleEl) titleEl.innerText = title;
      if (percentEl) percentEl.innerText = `${percent}%`;
      if (barEl) barEl.style.width = `${percent}%`;
    }

              ตรวจความถูกต้อง 🎒
            </button>
          </div>
        </div>

    }

    function renderStage4ListHTML() {
      return stage4Steps.map((step, idx) => `
        <div class="flex items-center justify-between bg-white border-2 border-emerald-100 hover:border-emerald-300 p-2 sm:p-2.5 rounded-xl shadow-sm transition">

            <span class="w-6 h-6 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-xs flex items-center justify-center shrink-0">

          </div>
          <div class="flex items-center gap-1">

            </button>

              ⬇️
            </button>

    }

    function moveStage4Item(index, direction) {
      playSound('click');
      const target = index + direction;
      if (target < 0 || target >= stage4Steps.length) return;
      const tmp = stage4Steps[index];
      stage4Steps[index] = stage4Steps[target];
      stage4Steps[target] = tmp;
      document.getElementById('stage4-list').innerHTML = renderStage4ListHTML();
    }

    function checkStage4() {
      // Correct order check
      // 1. wake
      // 2. bath
      // 3. dress
      // 4. eat
      // 5. bag
      // 6. school
      // (Accept slight variations like bag before eat or vice versa, but wake must be 1st, school must be last, bath before dress)
      const ids = stage4Steps.map(s => s.id);
      const isWakeFirst = ids[0] === 'wake';
      const isSchoolLast = ids[ids.length - 1] === 'school';
      const isBathBeforeDress = ids.indexOf('bath') < ids.indexOf('dress');
      const isDressBeforeSchool = ids.indexOf('dress') < ids.indexOf('school');

      if (isWakeFirst && isSchoolLast && isBathBeforeDress && isDressBeforeSchool) {
        playSound('correct');
        triggerConfetti();
        if (gameState.stageScores.stage4 === 0) {
          gameState.stageScores.stage4 = 10;
          gameState.score += 10;
          updateScoreDisplay();
        }
        showModal(
          '🌟 ยอดเยี่ยมมากครับ!',
          '“การแบ่งงานออกเป็นขั้นตอนเล็ก ๆ ช่วยให้เราจัดการปัญหาได้ง่ายขึ้นและไม่สับสน!” หนูเริ่มมองเห็นพลังของการแยกปัญหาแล้วนะ',
          'ไปลุยด่านที่ 5 ภารกิจสุดท้ายกัน! 🔬',
          renderStage5
        );
      } else {
        playSound('hint');
        showModal(
          '🤔 ตรวจสอบลำดับใหม่อีกนิดครับ',
          'ลองเช็กดูว่า: เริ่มต้นด้วยการ "ตื่นนอน" หรือยัง? แล้ว "อาบน้ำ" ก่อน "แต่งตัว" ใช่ไหม? และ "เดินทางไปโรงเรียน" ต้องเป็นขั้นตอนสุดท้ายสุดนะ',
          'ลองจัดลำดับใหม่',
          () => closeModal(),
          true
        );
      }
    }

    // Stage 5: Category sorting for Science Day event
    // Items to categorize into 2 buckets:
    // Bucket A: "ฝ่ายจัดเตรียมสถานที่และตกแต่ง" -> [ตกแต่งห้อง, เตรียมโต๊ะ, ทำป้ายงาน]
    // Bucket B: "ฝ่ายกิจกรรมและการทดลอง" -> [เตรียมอุปกรณ์ทดลอง, แบ่งหน้าที่สมาชิก, ตรวจความเรียบร้อย]
    const stage5Items = [
      { id: 1, name: "ตกแต่งห้องเรียน 🎨", target: 'place' },
      { id: 2, name: "เตรียมโต๊ะนิทรรศการ 🪑", target: 'place' },
      { id: 3, name: "เตรียมอุปกรณ์ทดลองวิทยาศาสตร์ 🧪", target: 'exp' },
      { id: 4, name: "ทำป้ายชื่องานวันวิทยาศาสตร์ 🪧", target: 'place' },
      { id: 5, name: "แบ่งหน้าที่สมาชิกในกลุ่ม 👥", target: 'exp' },
      { id: 6, name: "ตรวจความเรียบร้อยของการทดลอง 📋", target: 'exp' }
    ];

    let currentItemIdx = 0;
    let placedItems = {
      place: [],
      exp: []
    };

    function renderStage5() {
      gameState.currentStep = 'stage5';
      setProgress('ด่านที่ 5: ภารกิจสุดท้าย - งานวันวิทยาศาสตร์', 90);
      currentItemIdx = 0;
      placedItems = { place: [], exp: [] };

      updateStage5UI();
    }

      const isComplete = currentItemIdx >= stage5Items.length;
      const currentItem = stage5Items[currentItemIdx];

      container.innerHTML = `
        <div class="flex flex-col h-full justify-between">
          <div>
            <div class="flex items-center justify-between border-b pb-2 mb-2">
              <span class="text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-100 px-2.5 py-1 rounded-full">ด่านที่ 5 / 5</span>
              <span class="text-xs font-semibold text-slate-500">รางวัล: +10 คะแนน</span>

    function assignStage5Item(bucketKey) {
      playSound('click');
      const item = stage5Items[currentItemIdx];
      placedItems[bucketKey].push(item);
      currentItemIdx++;
      updateStage5UI();
    }

    function resetStage5() {
      playSound('click');
      currentItemIdx = 0;
      placedItems = { place: [], exp: [] };
      updateStage5UI();
    }

    function checkStage5() {
      // Validate
      const placeCorrect = placedItems.place.every(item => item.target === 'place') && placedItems.place.length === 3;
      const expCorrect = placedItems.exp.every(item => item.target === 'exp') && placedItems.exp.length === 3;

      if (placeCorrect && expCorrect) {
        playSound('correct');
        triggerConfetti();
        if (gameState.stageScores.stage5 === 0) {
          gameState.stageScores.stage5 = 10;
          gameState.score += 10;
          updateScoreDisplay();
        }
        showModal(
          '🏆 ภารกิจสำเร็จครบทั้ง 5 ด่าน!',
          'เยี่ยมยอดที่สุด! เมื่อเราแยกปัญหาใหญ่ออกเป็นงานย่อย แล้วจัดเป็นหมวดหมู่ งานวิทยาศาสตร์ของห้องก็จะสำเร็จได้อย่างรวดเร็วและทุกคนรู้หน้าที่ชัดเจนครับ',

          () => {
            closeModal();
            resetStage5();
          },
          true
        );
      }
    }

    function startQuiz() {
      gameState.currentStep = 'quiz';
      gameState.quizCurrentIndex = 0;
      gameState.stageScores.quiz = 0;
      // Shuffle quiz question order
      gameState.quizPool = [...gameState.quizPool].sort(() => Math.random() - 0.5);
      renderQuizQuestion();
    }

      const idx = gameState.quizCurrentIndex;
      const total = gameState.quizPool.length;

        renderSummaryScreen();

    function handleQuizAnswer(choiceIdx) {
      playSound('click');

        gameState.score += 2; // 5 questions * 2 = 10 pts max

            </p>
            <p class="text-xs sm:text-sm text-indigo-700 font-semibold mt-2">
              “เก่งมาก! ตอนนี้เธอรู้จักวิธีแยกปัญหาแล้ว ลองนำวิธีนี้ไปใช้กับปัญหาในชีวิตประจำวันดูนะ!”
            </p>
          </div>

          <!-- Action buttons -->
          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="restartGame()" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold rounded-2xl shadow-md active:scale-95 transition text-sm">
              🔄 เล่นใหม่อีกครั้ง
            </button>
          </div>
        </div>
      `;
    }

    let currentModalAction = null;

    function showModal(title, message, btnText, nextAction, isRetry = false) {
      const modal = document.getElementById('feedback-modal');
      const box = document.getElementById('feedback-box');
      const titleEl = document.getElementById('feedback-title');
      const msgEl = document.getElementById('feedback-message');
      const btn = document.getElementById('modal-next-btn');
      const icon = document.getElementById('feedback-icon');

      titleEl.innerHTML = title;
      msgEl.innerHTML = message;
      btn.innerText = btnText;
      icon.innerText = isRetry ? '💡' : '🎉';

      if (isRetry) {
        btn.className = "px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition";
      } else {
        btn.className = "px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition";
      }

      currentModalAction = nextAction;
      btn.onclick = () => {
        closeModal();
        if (currentModalAction) currentModalAction();
      };

      modal.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95');
        box.classList.add('scale-100');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('feedback-modal');
      const box = document.getElementById('feedback-box');
      box.classList.remove('scale-100');
      box.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150);
    }

    function startStage1() {
      playSound('click');
      renderStage1();
    }

    function restartGame() {
      playSound('click');
      gameState.score = 0;
      gameState.stageScores = {
        stage1: 0,
        stage2: 0,
        stage3: 0,
        stage4: 0,
        stage5: 0,
        quiz: 0
      };
      updateScoreDisplay();
      renderIntro();
    }

    window.onload = function() {
      renderIntro();
    };
  </script>
</body>
</html>
